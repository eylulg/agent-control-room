name: Install dependencies
description: Checks out and builds @eylulg/ui next to the app, then installs. Remove once the library is published to npm.

runs:
    using: composite
    steps:
        - uses: actions/checkout@v7
          with:
              repository: eylulg/ui
              path: ui-src
        - uses: actions/setup-node@v7
          with:
              node-version: 24
              cache: npm
              cache-dependency-path: |
                  package-lock.json
                  ui-src/package-lock.json
        - name: Build @eylulg/ui
          working-directory: ui-src
          shell: bash
          run: npm ci && npm run build
        - name: Install the app against the built library
          shell: bash
          run: |
              npm pkg set dependencies.@eylulg/ui=file:./ui-src
              npm install --no-audit --no-fund
